<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피카츄 모래시계</title>{{refresh}}<meta name="description" content="피카츄와 함께 잠깐 집중하는 작은 모래시계 타이머"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffdc45'/%3E%3Cpath d='M19 3 9 18h7l-3 11 11-16h-8z' fill='%23232323'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#ffdc45;color:#292923;font-family:Arial,'Noto Sans KR',sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px 16px}main{width:min(100%,430px);text-align:center}header{display:flex;align-items:center;justify-content:space-between;margin:0 6px 23px;font-size:14px;font-weight:700;letter-spacing:2px}.number{letter-spacing:1px;opacity:.65}.card{background:#fffef5;border:2px solid #292923;border-radius:28px;box-shadow:6px 7px 0 #292923;padding:30px 28px 27px}h1{font-size:26px;letter-spacing:-1px;margin:0 0 6px}p{font-size:14px;color:#68685d;margin:0}.scene{height:210px;position:relative;display:flex;justify-content:center;align-items:center;margin:16px 0 0}.hourglass{width:112px;height:164px;overflow:visible}.poke{width:132px;height:132px;image-rendering:pixelated;position:absolute;left:calc(50% + 17px);bottom:4px;filter:drop-shadow(0 7px 0 #29292312)}.clock{font-size:64px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-3px;line-height:1.2;margin:0}.status{min-height:24px;margin:8px 0 24px}.presets{display:flex;gap:8px;margin-bottom:20px}button{font:inherit;cursor:pointer;touch-action:manipulation}.presets button{flex:1;background:transparent;border:1px solid #d9d9cb;border-radius:12px;padding:11px 0;font-size:14px;color:#55564b}.presets button[aria-pressed=true]{background:#ffdc45;border-color:#292923;color:#292923;font-weight:bold}.actions{display:flex;gap:9px}.actions button{border:0;border-radius:13px;padding:15px;font-weight:700;font-size:16px}.start{flex:1;background:#292923;color:white}.reset{background:#eeeee3;color:#292923}button:hover{filter:brightness(.95)}button:focus-visible{outline:3px solid #3564db;outline-offset:3px}footer{font-size:12px;margin:22px 0 0;color:#544b22}.running .poke{animation:bob 1s ease-in-out infinite alternate}.stream{opacity:0}.running .stream{opacity:1}@keyframes bob{to{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.running .poke{a </style></head><body class="{{running}}"><main><header><span>POKÉ TIMER</span><span class="number">NO. 025 ⚡</span></header><section class="card"><h1>피카츄 모래시계</h1><p>잠깐, 피카츄와 함께 집중해요.</p><div class="scene"><svg class="hourglass" viewBox="0 0 112 164" role="img" aria-label="남은 시간에 따라 모래가 줄어드는 모래시계"><defs><clipPath id="glass"><path d="M17 13H95C95 53 75 65 59 81C75 98 95 110 95 151H17C17 111 37 98 53 81C37 65 17 53 17 13Z"/></clipPath></defs><path d="M17 13H95C95 53 75 65 59 81C75 98 95 110 95 151H17C17 111 37 98 53 81C37 65 17 53 17 13Z" fill="#f3f6ed" stroke="#292923" stroke-width="3"/><g clip-path="url(#glass)" fill="#edb832"><rect id="topSand" x="16" y="{{topY}}" width="80" height="{{topHeight}}"/><rect id="bottomSand" x="16" y="{{bottomY}}" width="80" height="{{bottomHeight}}"/><path class="stream" d="M55 79h2v71h-2z"/></g><path d="M25 25q0 25 15 39" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><rect x="8" y="3" width="96" height="12" rx="5" fill="#292923"/><rect x="8" y="149" width="96" height="12" rx="5" fill="#292923"/></svg><img class="poke" src="/pikachu.png" alt="피카츄" width="132" height="132"></div><div class="clock" role="timer" aria-label="남은 시간">{{time}}</div><p class="status" role="status">{{status}}</p><form method="post" action="/timer"><div class="presets" aria-label="타이머 시간"><button name="action" value="minutes-1" aria-pressed="{{selected1}}">1분</button><button name="action" value="minutes-3" aria-pressed="{{selected3}}">3분</button><button name="action" value="minutes-5" aria-pressed="{{selected5}}">5분</button><button name="action" value="minutes-10" aria-pressed="{{selected10}}">10분</button></div><div class="actions"><button class="start" name="action" value="toggle">{{button}}</button><button class="reset" name="action" value="reset" aria-label="타이머 초기화">초기화</button></div></form></section><footer>작은 집중, 한 번에 한 모래알씩.</footer></main></body></html>
